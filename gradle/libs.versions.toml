[versions]
# AGP 9.3.1 requires Gradle 9.5 and runs on JDK 17.
agp = "9.3.1"

# HDCharts 2.4.0 and AndroidX Core 1.19.0 require compile SDK 37.1.
androidCompileSdk = "37"
androidCompileSdkMinor = "1"
androidMinSdk = "24"
androidTargetSdk = "37"
java = "17"

junit = "4.13.2"
activityCompose = "1.13.0"
kotlin = "2.4.10"
ksp = "2.3.10"
# Keep the explicit Compose version aligned with the BOM below. The published
# library modules cannot rely on the app's BOM to provide their metadata.
composeBom = "2026.06.01"
composeUi = "1.11.4"
charts = "2.4.0"
ktlint = "14.2.0"
vanniktechPublish = "0.37.0"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
kotlinpoet = "2.3.0"
dokka = "2.2.0"
axionRelease = "1.21.2"

[libraries]
# The app consumes BOM-managed Compose aliases. Library modules use the
# explicit Compose version aliases below because their published metadata must
# carry a concrete runtime version.
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
dautovicharis-charts = { group = "io.github.dautovicharis", name = "charts", version.ref = "charts" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeUi" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUi" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUi" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-gif-recorder = { id = "io.github.hdcodedev.compose-gif-recorder" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axionRelease" }
