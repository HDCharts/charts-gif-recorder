# Workflow: publish a weekly snapshot release when recent changes justify it.
# It can also be triggered manually.
#
# This is the automated pre-release path for the repo.
name: Snapshot Release
on:
  workflow_dispatch:
  schedule:
    # Runs weekly on Sunday at 00:00 UTC.
    - cron: '0 0 * * 0'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect recent changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual run - proceeding regardless of recent changes."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git log --since="7 days ago" --name-only --pretty=format: | sort -u)
          if [ -z "${files:-}" ]; then
            echo "No commits in the last 7 days."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          filtered=$(echo "$files" | grep -vE '(^docs/|\.md$|^\.github/workflows/deploy-api-docs\.yml$)' || true)
          if [ -z "${filtered:-}" ]; then
            echo "Only ignored paths changed in the last 7 days."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in the last 7 days:"
            echo "$filtered"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  snapshot-release:
    name: Publish Snapshot Release
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    outputs:
      published: ${{ steps.secrets_check.outputs.can_publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache Gradle packages
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get snapshot version from Axion
        id: version
        run: |
          set -euo pipefail
          SNAPSHOT_VERSION="$(cd lib && ./gradlew -q currentVersion -Prelease.quiet)"
          if [ -z "${SNAPSHOT_VERSION:-}" ]; then
            echo "Failed to resolve version from Axion currentVersion task." >&2
            exit 1
          fi

          if [[ "$SNAPSHOT_VERSION" != *"-SNAPSHOT"* ]]; then
            echo "⏭️  Skipping snapshot release - version is not a SNAPSHOT: ${SNAPSHOT_VERSION}"
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          fi

          echo "snapshot_version=${SNAPSHOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${SNAPSHOT_VERSION}"

      - name: Check required secrets
        if: ${{ steps.version.outputs.is_snapshot == 'true' }}
        id: secrets_check
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY_ID SIGNING_PASSWORD SIGNING_IN_MEMORY_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "Missing secret: $v" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish snapshot to Maven Central
        if: ${{ steps.version.outputs.is_snapshot == 'true' && steps.secrets_check.outputs.can_publish == 'true' }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralPublishing: "true"
          ORG_GRADLE_PROJECT_signAllPublications: "true"
        run: |
          set -euo pipefail
          echo "Publishing snapshot version: ${{ steps.version.outputs.snapshot_version }}"
          cd lib
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -PmavenCentralUsername="${MAVEN_CENTRAL_USERNAME}" \
            -PmavenCentralPassword="${MAVEN_CENTRAL_PASSWORD}" \
            -PsigningInMemoryKey="${SIGNING_IN_MEMORY_KEY}" \
            -PsigningInMemoryKeyId="${SIGNING_KEY_ID}" \
            -PsigningInMemoryKeyPassword="${SIGNING_PASSWORD}" \
            --no-daemon --stacktrace

      - name: Comment on commit
        if: ${{ steps.version.outputs.is_snapshot == 'true' && steps.secrets_check.outputs.can_publish == 'true' }}
        uses: actions/github-script@v9.0.0
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.snapshot_version }}
        with:
          script: |
            const version = process.env.SNAPSHOT_VERSION;
            const message = [
              '🚀 **Snapshot Release Published**',
              '',
              `Version: \`${version}\``,
              '',
              'The snapshot is now available on Maven Central Snapshots repository.',
              '',
              'Add the snapshot repository to your project:',
              '```kotlin',
              'repositories {',
              '    maven("https://central.sonatype.com/repository/maven-snapshots/")',
              '}',
              '```',
              '',
              'Apply the plugin in your `build.gradle.kts`:',
              '```kotlin',
              'plugins {',
              `    id("io.github.hdcodedev.compose-gif-recorder") version "${version}"`,
              '}',
              '```',
              '',
              'The plugin automatically adds all required dependencies (`annotations`, `core`, `android-test`, `ksp`).',
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            })

  deploy-api-docs:
    name: Deploy API Docs
    needs: snapshot-release
    if: ${{ needs.snapshot-release.outputs.published == 'true' }}
    uses: ./.github/workflows/deploy-api-docs.yml
    with:
      mode: snapshot
      source_ref: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
