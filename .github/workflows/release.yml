# Workflow: publish a release for the gif recorder project.
# It validates versioning and release prerequisites before publishing.
#
# This is the manual release path.
name: Release
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve release version from Axion
        id: version
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(cd lib && ./gradlew -q currentVersion -Prelease.quiet)"
          if [[ "$CURRENT_VERSION" != *"-SNAPSHOT" ]]; then
            echo "Expected an untagged SNAPSHOT version, got: ${CURRENT_VERSION}" >&2
            exit 1
          fi
          VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved version is not SemVer-compatible: ${VERSION}" >&2
            exit 1
          fi
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: ${VERSION}"

      - name: Verify tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.release_version }}" >/dev/null; then
            echo "Release tag already exists: ${{ steps.version.outputs.release_version }}" >&2
            exit 1
          fi

      - name: Check required secrets
        id: secrets_check
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY_ID SIGNING_PASSWORD SIGNING_IN_MEMORY_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "Missing secret: $v" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag locally with Axion
        if: ${{ steps.secrets_check.outputs.can_publish == 'true' }}
        run: |
          cd lib
          ./gradlew createRelease \
            -PrecorderReleaseVersion="${{ steps.version.outputs.release_version }}" \
            -Prelease.disableRemoteCheck \
            --no-daemon --stacktrace

      - name: Publish to Maven Central
        if: ${{ steps.secrets_check.outputs.can_publish == 'true' }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Publishing release version: ${{ steps.version.outputs.release_version }}"
          cd lib
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -PrecorderReleaseVersion="${{ steps.version.outputs.release_version }}" \
            -PmavenCentralUsername="${MAVEN_CENTRAL_USERNAME}" \
            -PmavenCentralPassword="${MAVEN_CENTRAL_PASSWORD}" \
            -PsigningInMemoryKey="${SIGNING_IN_MEMORY_KEY}" \
            -PsigningInMemoryKeyId="${SIGNING_KEY_ID}" \
            -PsigningInMemoryKeyPassword="${SIGNING_PASSWORD}" \
            --no-daemon --no-build-cache --stacktrace

      - name: Push release tag with Axion
        if: ${{ steps.secrets_check.outputs.can_publish == 'true' }}
        run: |
          cd lib
          ./gradlew pushRelease -Prelease.pushTagsOnly --no-daemon --stacktrace

      - name: Comment on success
        if: ${{ steps.secrets_check.outputs.can_publish == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.release_version }}';
            const message = [
              '🎉 **Release Published Successfully!**',
              '',
              `Version: \`${version}\``,
              '',
              '✅ Published to Maven Central',
              '✅ Git tag created',
              '',
              'Apply the plugin in your `build.gradle.kts`:',
              '```kotlin',
              'plugins {',
              `    id("io.github.hdcodedev.compose-gif-recorder") version "${version}"`,
              '}',
              '```',
              '',
              'The plugin automatically adds all required dependencies (`annotations`, `core`, `android`, `ksp`).',
              '',
              `📦 [Maven Central](https://central.sonatype.com/artifact/io.github.hdcodedev/compose-gif-recorder-gradle-plugin/${version})`,
            ].join('\n');

            // Create a comment on the commit
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            });
