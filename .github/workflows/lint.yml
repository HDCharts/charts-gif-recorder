# Reusable lint checks for pull request orchestration.
#
# This is the main lint gate for the repo.
name: Lint

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Lint
        run: |
          set -euo pipefail
          ./gradlew ktlintCheck
          ./gradlew -p lib ktlintCheck
