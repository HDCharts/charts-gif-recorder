# Reusable test suite for pull request orchestration.
# It uploads a test summary artifact for inspection from the workflow run.
#
# This is the main automated test gate.
name: Test

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}
      - name: Validate CI scripts
        run: |
          set -euo pipefail
          bash scripts/ci-has-code-changes.sh --self-test
          bash scripts/ci-should-run-gif-validation.sh --self-test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Test
        run: |
          set -euo pipefail
          ./gradlew appTest
          cd lib
          ./gradlew recorderTest
      - name: Upload Gradle test reports
        if: ${{ always() && inputs.should-run }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-reports
          if-no-files-found: warn
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
