# Reusable test suite for pull request orchestration.
# It uploads a test summary artifact for inspection from the workflow run.
#
# This is the main automated test gate.
name: Test

on:
  workflow_call:
    inputs:
      should-run:
        description: Whether the pull request contains code or build changes.
        required: true
        type: boolean
      source-sha:
        description: Immutable revision being checked.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: ${{ inputs.should-run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.source-sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Test
        id: gradle_tests
        run: |
          set -euo pipefail
          ./gradlew appTest
          cd lib
          ./gradlew recorderTest
      - name: Test summary
        if: always()
        env:
          CI_GRADLE_TEST_OUTCOME: ${{ steps.gradle_tests.outcome }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_SHOULD_RUN: ${{ inputs.should-run }}
        run: bash scripts/ci-test-summary.sh
      - name: Ensure summary files exist
        if: always()
        run: |
          if [ ! -f ci-test-summary.md ] || [ ! -f ci-test-summary.json ]; then
            CI_TEST_SUMMARY_FORCE_ZERO=true \
            CI_TEST_SUMMARY_SKIP_STEP_SUMMARY=true \
            CI_GRADLE_TEST_OUTCOME="${{ steps.gradle_tests.outcome }}" \
            CI_JOB_STATUS="${{ job.status }}" \
            CI_SHOULD_RUN="${{ inputs.should-run }}" \
            bash scripts/ci-test-summary.sh
          fi
      - name: Upload test summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-summary
          if-no-files-found: error
          path: |
            ci-test-summary.md
            ci-test-summary.json
